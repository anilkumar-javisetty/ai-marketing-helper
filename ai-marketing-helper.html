<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Marketing Helper</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--ac:#2563eb;--bd:#d0d4da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eee;--card:#22262b;--ac:#6ea0ff;--bd:#3a3f46}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eee;--card:#22262b;--ac:#6ea0ff;--bd:#3a3f46}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Arial,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:8px 0 2px}p.s{margin:0 0 14px;opacity:.7;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-family:inherit}
button{width:100%;margin-top:16px;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--ac);color:#fff}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);margin-top:8px}
button:disabled{opacity:.5}
#out{white-space:pre-wrap;margin-top:18px;padding:14px;background:var(--card);border-radius:8px;line-height:1.5;display:none}
#msg{margin-top:12px;font-size:14px;color:#b45309}
</style></head><body>
<h1>AI Marketing Helper</h1>
<p class="s">Write marketing messages in seconds.</p>
<label>Business / Product name</label><input id="b" placeholder="e.g. Sri Sai Sweets">
<label>What do you sell? (1 line)</label><input id="w" placeholder="e.g. homemade sweets and snacks">
<label>Who is the customer?</label><input id="c" placeholder="e.g. families in Guntur">
<label>What do you want to write?</label>
<select id="t"><option>Cold email to a company</option><option>Instagram post</option><option>WhatsApp offer message</option><option>Product description</option></select>
<label>Language</label>
<select id="l"><option>English</option><option>Telugu</option><option>Hindi</option></select>
<button id="go">Generate</button>
<div id="msg"></div>
<div id="out"></div>
<button class="g" id="cp" style="display:none">Copy</button>
<div id="wa">
<h1 style="font-size:18px;margin-top:22px">Send to mobile numbers</h1><label>Mobile numbers (one per line, with country code)</label>
<textarea id="n" rows="4" placeholder="919876543210&#10;919123456789"></textarea>
<button id="send">Send on WhatsApp (next number)</button>
<div id="st" style="margin-top:8px;font-size:14px;opacity:.8"></div>
<p class="s" style="margin-top:10px">Send only to customers who agreed to receive messages.</p>
</div>
<script>
const $=id=>document.getElementById(id);
let sample=null;
claude.use("sample").then(s=>{sample=s;if(!s)$("msg").textContent="AI is not available in this view. Open this page inside Claude."}).catch(()=>{});
$("go").onclick=async()=>{
  if(!sample){$("msg").textContent="AI is not available in this view.";return}
  if(!$("b").value.trim()||!$("w").value.trim()){$("msg").textContent="Please fill business name and what you sell.";return}
  $("msg").textContent="";$("go").disabled=true;$("go").textContent="Writing...";
  const p=`Write a ${$("t").value} in ${$("l").value}.
Business: ${$("b").value}
Selling: ${$("w").value}
Customer: ${$("c").value||"general customers"}
Rules: short, friendly, clear call-to-action, no fake claims or numbers. Output only the final message.`;
  try{
    const r=await sample(p,{cache:false,onText:({text})=>{$("out").style.display="block";$("out").textContent=text}});
    $("out").style.display="block";$("out").textContent=r.text;$("cp").style.display="block";$("wa").style.display="block";
  }catch(e){$("msg").textContent=e&&e.code==="not_granted"?"Permission needed to use AI.":"Something went wrong. Try again."}
  $("go").disabled=false;$("go").textContent="Generate";
};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);$("cp").textContent="Copied!"}catch(e){$("cp").textContent="Select text and copy"}setTimeout(()=>$("cp").textContent="Copy",1500)};
$("send").textContent="Show WhatsApp links";
$("send").onclick=()=>{
  const msg=$("out").textContent.trim();
  if(!msg){$("st").textContent="First tap Generate to create a message.";return}
  const nums=$("n").value.split("\n").map(x=>x.replace(/\D/g,"")).filter(x=>x.length>=10);
  if(!nums.length){$("st").textContent="Enter at least one valid number.";return}
  $("st").innerHTML="";
  nums.forEach(n=>{
    const a=document.createElement("a");
    a.href="https://wa.me/"+n+"?text="+encodeURIComponent(msg);
    a.target="_blank";a.rel="noopener";
    a.textContent="Open WhatsApp: +"+n;
    a.style.cssText="display:block;margin-top:8px;padding:12px;border-radius:8px;background:#16a34a;color:#fff;text-align:center;font-weight:600;text-decoration:none";
    $("st").appendChild(a);
  });
};
</script></body></html>
